<!-- Ícono VentaFlow animado (se dibuja al cargar). Pega este bloque dentro de tu <header>, y el <style> dentro de <head> o de tu CSS global. -->
<style>
  @keyframes vf-draw{to{stroke-dashoffset:0;}}
  @keyframes vf-fill{to{fill-opacity:1;}}
  .vf-path{stroke:#1e3a5f;stroke-width:4;fill:#1e3a5f;fill-opacity:0;stroke-dasharray:400;stroke-dashoffset:400;animation:vf-draw 1.1s ease forwards, vf-fill 0.5s ease forwards 1s;}
  .vf-arrow{stroke:#2fbfa0;stroke-width:4;fill:#2fbfa0;fill-opacity:0;stroke-dasharray:160;stroke-dashoffset:160;animation:vf-draw 0.6s ease forwards 0.7s, vf-fill 0.4s ease forwards 1.3s;}
  .vf-word{opacity:0;animation:vf-fill 0.5s ease forwards 1.5s;}
</style>

<div style="display:flex;align-items:center;gap:10px;">
  <svg width="34" height="34" viewBox="0 0 120 120">
    <path class="vf-path" d="M14 20 L60 100 L106 20 L86 20 L60 66 L34 20 Z"/>
    <path class="vf-arrow" d="M60 66 L94 22 L94 40 L110 40 Z"/>
  </svg>
  <span class="vf-word" style="font:800 20px/1 Helvetica,Arial,sans-serif;letter-spacing:-0.02em;">
    <span style="color:#1e3a5f">Venta</span><span style="color:#2fbfa0">Flow</span>
  </span>
</div>
